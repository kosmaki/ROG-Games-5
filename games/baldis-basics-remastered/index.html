<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baldi's Basics Classic Remastered</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
      #unity-container, #unity-container.unity-desktop { position: fixed; inset: 0; width: 100%; height: 100%; transform: none; left: 0; top: 0; }
      #unity-canvas, .unity-mobile #unity-canvas { display: block; width: 100%; height: 100%; background: #000; }
      #unity-footer { display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
    </div>
    <script>
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/Fixes.loader.js";
      const config = {
        dataUrl: buildUrl + "/Fixes.data",
        frameworkUrl: buildUrl + "/Fixes.framework.js",
        codeUrl: buildUrl + "/Fixes.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Basically, Games!",
        productName: "Baldi's Basics Classic Remastered",
        productVersion: "1.0"
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const mobileWarning = document.querySelector("#unity-mobile-warning");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => { mobileWarning.style.display = "none"; }, 5000);
      }

      loadingBar.style.display = "block";
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(() => {
          loadingBar.style.display = "none";
        }).catch((error) => {
          console.error("Baldi Unity failed to load:", error);
          loadingBar.style.display = "none";
          const message = document.createElement("div");
          message.style.cssText = "position:fixed;inset:0;display:grid;place-items:center;background:#111;color:white;font:16px sans-serif;padding:24px;text-align:center;";
          message.textContent = "Baldi couldn't load. Check that the Unity Build files are available and try refreshing.";
          document.body.appendChild(message);
        });
      };
      script.onerror = () => {
        loadingBar.style.display = "none";
        alert("Couldn't load Baldi's Unity loader. Please refresh and try again.");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
