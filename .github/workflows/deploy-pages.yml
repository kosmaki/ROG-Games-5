name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Brotli decoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes brotli
      - name: Prepare latest Baldi build for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          build_dir="games/baldi-remaster/baldi-remaster/Build"
          for file in Fixes.data Fixes.framework.js Fixes.wasm; do
            source_file="$build_dir/$file.br"
            output_file="$build_dir/$file"
            test -s "$source_file"
            brotli --decompress --force --output="$output_file" "$source_file"
            test -s "$output_file"
          done
      - name: Verify Baldi build files are present
        shell: bash
        run: |
          set -euo pipefail
          build_dir="games/baldi-remaster/baldi-remaster/Build"
          for file in Fixes.data Fixes.framework.js Fixes.wasm; do
            test -s "$build_dir/$file"
            ls -lh "$build_dir/$file"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
