<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Baldi's Basics Classic Remastered Remake</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Fixes.loader.js";
      var config = {
        dataUrl: buildUrl + "/Fixes.data.br",
        frameworkUrl: buildUrl + "/Fixes.framework.js.br",
        codeUrl: buildUrl + "/Fixes.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Basically, Games!",
        productName: "Baldi's Basics Classic Remastered Remake",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function fitCanvas() {
        var width = window.innerWidth;
        var height = window.innerHeight;
        var gameAspect = 960 / 600;
        var viewAspect = width / height;
        if (viewAspect > gameAspect) {
          canvas.style.height = height + "px";
          canvas.style.width = (height * gameAspect) + "px";
        } else {
          canvas.style.width = width + "px";
          canvas.style.height = (width / gameAspect) + "px";
        }
        container.style.width = canvas.style.width;
        container.style.height = canvas.style.height;
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", fitCanvas);
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(() => {
          loadingBar.style.display = "none";
          fitCanvas();
        }).catch((message) => {
          console.error(message);
          warningBanner.textContent = "Game failed to load. Check the browser console for details.";
          warningBanner.style.display = "block";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
