<!DOCTYPE html>
<!-- Redeploy trigger: use uncompressed Unity assets for GitHub Pages compatibility -->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Baldi's Basics Classic Remastered Remake</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: relative;
        inset: auto;
        transform: none;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
      }
      #unity-canvas,
      .unity-mobile #unity-canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        max-width: 100%;
        max-height: 100%;
        background: #000;
      }
      #unity-footer,
      #unity-webgl-logo,
      #unity-fullscreen-button,
      #unity-build-title {
        display: none !important;
      }
      #unity-loading-bar {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Fixes.loader.js";
      var config = {
        // Use the uncompressed Unity build files. GitHub Pages may not serve
        // Brotli .br files with the Content-Encoding Unity expects.
        dataUrl: buildUrl + "/Fixes.data",
        frameworkUrl: buildUrl + "/Fixes.framework.js",
        codeUrl: buildUrl + "/Fixes.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Basically, Games!",
        productName: "Baldi's Basics Classic Remastered Remake",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var mobileWarning = document.querySelector("#unity-mobile-warning");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => {
          mobileWarning.style.display = "none";
        }, 5000);
      }

      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then(() => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          console.error("Unity failed to load:", message);
          mobileWarning.textContent = "Game failed to load: " + message;
          mobileWarning.style.display = "block";
        });
      };
      script.onerror = () => {
        console.error("Could not load Unity loader:", loaderUrl);
        mobileWarning.textContent = "Game failed to load: Unity loader could not be downloaded.";
        mobileWarning.style.display = "block";
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
